    label: Width
    required: true
    default: 960
    min: 32
    max: 2048
    step: 32
  height:
    type: integer
    label: Height
    required: true
    default: 544
    min: 32
    max: 2048
    step: 32
  seed:
    type: seed
    label: Seed
    default: random
    min: 0
    max: 1125899906842624
bindings:
  - source: duration_seconds
    target:
      node: "22"
      input: value
  - source: prompt
    target:
      node: "14"
      input: prompt
  - source: first_frame
    target:
      node: "24"
      input: image
    clear_targets:
      - node: "14"
        input: first_frame
  - source: last_frame
    target:
      node: "28"
      input: image
    clear_targets:
      - node: "14"
        input: last_frame
  - source: width
    target:
      node: "14"
      input: width
  - source: height
    target:
      node: "14"
      input: height
  - source: seed
    target:
      node: "15"
