name: Source-only CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust source checks
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AI_STUDIO_LIVE_COMFY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          # Restore only: post-job packing must not consume the validation budget.
          save-if: "false"

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1

  frontend_tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: windows-latest
    # Split independent test files across three Windows runners. Keep existing
    # individual test deadlines, assertions, and complete source coverage.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 20
    env:
      # Historical successor probes retain immutable blobs; raise the heap ceiling
      # without relaxing assertions or dropping negative proof coverage.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Frozen historical proofs require their full immutable parent history.
          fetch-depth: 0

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests (full shard)
        run: pnpm test --maxWorkers=1 --shard=${{ matrix.shard }}/3

      - name: Architecture guards
        if: ${{ matrix.shard == 1 }}
        run: pnpm test:architecture

      - name: TypeScript check
        if: ${{ matrix.shard == 1 }}
        run: pnpm exec tsc --noEmit

      - name: Frontend build
        if: ${{ matrix.shard == 1 }}
        # TypeScript checked above; avoid redundant tsc.
        run: pnpm exec vite build

  frontend:
    name: Frontend source checks
    # Retain the stable required-check name and require all shard checks.
    needs: [frontend_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all frontend shards and mandatory gates
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.frontend_tests.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "At least one frontend shard or mandatory gate did not succeed: $SHARD_RESULT"
            exit 1
          fi
          echo "All three shards, architecture, TypeScript and Vite succeeded."
