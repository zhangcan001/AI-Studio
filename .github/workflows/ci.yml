name: Source-only CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust source checks
    runs-on: windows-latest
    # Cold run 38843129757 took 32m26s (check 3m57s, test build 8m47s,
    # test execution 18m46s); runs 38767542286/38826401805 hit the old
    # 40-minute budget mid-suite. Bound cold runs plus cache packing to 60m.
    timeout-minutes: 60
    env:
      AI_STUDIO_LIVE_COMFY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          # Restore-only never seeded a cache (38843129757: "No cache found").
          # Only trusted master pushes write; PRs/tags/manual runs restore only.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Preserve the earlier post-cache timeout fix: do not pack large
          # Windows target artifacts. Cache registry dependencies only.
          cache-targets: "false"

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1

  frontend_tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: windows-latest
    # Ordinary unit/UI shards stay free of multi-minute Boundary probes so the
    # vitest worker RPC channel is not held open across a 7–17 minute sync run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 35
    env:
      # Historical successor probes retain immutable blobs; raise the heap ceiling
      # without relaxing assertions or dropping negative proof coverage.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Frozen historical proofs require their full immutable parent history.
          fetch-depth: 0

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests (non-Boundary shard)
        # Keep the established shard CLI; exclude only the heavy Boundary suite
        # (run in frontend_boundary_tests). Each file still uses a fresh forks
        # worker because vite.config disables singleFork.
        run: >-
          pnpm test --maxWorkers=1 --shard=${{ matrix.shard }}/3
          --exclude src/app/**/*Boundary*.test.ts
          --exclude src/app/**/*Boundary*.test.tsx
          --exclude scripts/testing/**/*[Bb]oundary*.test.ts
          --exclude scripts/testing/**/*[Bb]oundary*.test.tsx
          --exclude scripts/testing/immutable-git-cache.test.ts
          --exclude scripts/testing/release-boundary.test.ts

      - name: Architecture guards
        if: ${{ matrix.shard == 1 }}
        run: pnpm test:architecture

      - name: TypeScript check
        if: ${{ matrix.shard == 1 }}
        run: pnpm exec tsc --noEmit

      - name: Frontend build
        if: ${{ matrix.shard == 1 }}
        # TypeScript checked above; avoid redundant tsc.
        run: pnpm exec vite build

  frontend_boundary_tests:
    name: Frontend Boundary probes (${{ matrix.shard }}/3)
    runs-on: windows-latest
    # Separate VMs may run in parallel; each VM runs one Vitest process/file
    # at a time. Explicit discovery avoids literal CLI globs omitting tests.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Boundary and successor-guard probes
        run: pnpm test:boundary --shard=${{ matrix.shard }}/3

  frontend:
    name: Frontend source checks
    # Retain the stable required-check name; require shards + Boundary job.
    needs: [frontend_tests, frontend_boundary_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all frontend shards and mandatory gates
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.frontend_tests.result }}
          BOUNDARY_RESULT: ${{ needs.frontend_boundary_tests.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ] || [ "$BOUNDARY_RESULT" != "success" ]; then
            echo "Frontend shard or Boundary probes did not succeed: shards=$SHARD_RESULT boundary=$BOUNDARY_RESULT"
            exit 1
          fi
          echo "All three shards, Boundary probes, architecture, TypeScript and Vite succeeded."
