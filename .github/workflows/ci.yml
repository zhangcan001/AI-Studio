name: Source-only CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust source checks
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AI_STUDIO_LIVE_COMFY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          # Restore only: post-job packing must not consume the validation budget.
          save-if: "false"

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1

  frontend:
    name: Frontend source checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Exact successor proofs read immutable Phase8/12/13 baseline commits.
          fetch-depth: 0

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test --maxWorkers=1

      - name: Architecture guards
        run: pnpm test:architecture

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Frontend build
        # TypeScript was checked immediately above; build the same Vite bundle
        # without repeating tsc. Keep both independent authoritative gates.
        run: pnpm exec vite build
